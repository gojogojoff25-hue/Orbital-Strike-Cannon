# ============ ORBITAL STRIKE CANNON - CAU HINH ============
# Sua xong go /orbital reload (hoac restart server)

# Danh sach owner duoc LAY cannon bang lenh (ai cam cannon cung dung duoc)
owners:
  - NoName334301

# Hoi chieu giua 2 lan ban (giay)
cooldown-seconds: 3

# So lan ban truoc khi can cau vo (1 = ban 1 lan la vo)
rod-uses: 1

# Thoi gian "nap" tia sang truoc khi TNT roi (tick, 20 tick = 1 giay)
charge-ticks: 60

# Do cao TNT bat dau roi (block). TNT roi binh thuong va no dung luc cham dat
sky-height: 150

# Suc no moi qua TNT (4.0 = TNT mac dinh cua Minecraft)
tnt-yield: 4.0

# Khoang cach giua cac vong TNT va ban kinh toi da (block)
ring-spacing: 5
max-radius: 40

# Mat do TNT tren moi vong (so TNT = ban kinh x mat do)
tnt-density: 3

# Gioi han tong so TNT moi lan ban (de server khong bi qua tai)
max-tnt: 1000

# true = mac dinh Minecraft (block bi pha roi item). false = khong roi item (do lag hon)
block-drops: true

# true = nguoi ban khong bi sat thuong no trong luc ban. false = mac dinh (bi sat thuong)
protect-shooter: false

# Cac the gioi KHONG duoc dung cannon (vi du: [world_nether])
disabled-worlds: []
